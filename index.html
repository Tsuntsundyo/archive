<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#cbd8a5">
  <title>アーカイブサイト</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #cbd8a5;
      --ink: #252521;
      --muted: #77766e;
      --line: #d9d6cc;
      --gutter: clamp(20px, 5vw, 76px);
    }

    * { box-sizing: border-box; }

    body {
      position: relative;
      isolation: isolate;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .landscape {
      position: fixed;
      z-index: -1;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .walker {
      position: fixed;
      z-index: 0;
      width: clamp(64px, 8vw, 112px);
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 3px 3px rgb(47 43 33 / 24%));
      pointer-events: none;
      will-change: left, top;
    }

    .walker.entering { z-index: 2; }

    .page { position: relative; z-index: 1; width: min(1600px, 100%); margin: 0 auto; padding: 0 var(--gutter); }

    header {
      position: relative;
      min-height: 190px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding: 48px 0 28px;
      border-bottom: 1px solid var(--line);
    }

    header::before,
    header::after {
      content: "";
      position: absolute;
      z-index: 1;
      right: 0;
      left: 0;
      height: 16px;
      pointer-events: none;
      background:
        radial-gradient(circle at 9px 0, #fff 7px, transparent 7.5px) 0 0 / 18px 16px repeat-x,
        radial-gradient(circle at 0 8px, #fff 1.5px, transparent 2px) 0 0 / 18px 16px repeat-x;
    }

    header::before { top: -9px; }
    header::after { bottom: -9px; }

    h1 {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
      font-size: clamp(30px, 5vw, 54px);
      line-height: 1.15;
      font-weight: 500;
      letter-spacing: .08em;
    }

    .count {
      padding-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    main { padding: 36px 0 80px; }

    .site-footer {
      display: grid;
      place-items: center;
      min-height: 260px;
      padding: 28px 0 46px;
      border-top: 1px solid rgb(109 117 79 / 30%);
    }

    .home-illustration {
      display: block;
      width: clamp(210px, 27vw, 330px);
      height: auto;
      overflow: visible;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      max-width: 1240px;
      margin: 0 auto;
      column-gap: clamp(16px, 2.3vw, 36px);
      row-gap: 48px;
    }

    figure { min-width: 0; margin: 0; }

    .photo-button {
      display: block;
      width: 100%;
      padding: clamp(9px, 1.2vw, 14px);
      border: 0;
      background: #fff;
      cursor: zoom-in;
      overflow: hidden;
    }

    .photo-button img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      transition: transform 350ms ease;
    }

    .photo-button:hover img { transform: scale(1.015); }
    .photo-button:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

    figcaption {
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding-top: 13px;
      border-top: 1px solid var(--line);
      margin-top: 12px;
      font-size: 13px;
      letter-spacing: .04em;
    }

    .number { color: var(--muted); font-variant-numeric: tabular-nums; }
    .name { color: var(--ink); }
    .year { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 10px 0 0 32px; list-style: none; }
    .tag {
      padding: 4px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      letter-spacing: .03em;
    }

    dialog {
      width: min(92vw, 1100px);
      max-width: none;
      max-height: 92vh;
      padding: 0;
      border: 0;
      background: transparent;
      overflow: visible;
    }

    dialog::backdrop { background: rgb(20 20 18 / 88%); }
    dialog img { display: block; max-width: 100%; max-height: 86vh; margin: auto; object-fit: contain; }
    .close {
      position: absolute;
      top: -42px;
      right: 0;
      padding: 8px 0 8px 12px;
      border: 0;
      background: transparent;
      color: white;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 36px; }
      header { min-height: 160px; }
    }

    @media (max-width: 560px) {
      :root { --gutter: 18px; }
      header { min-height: 132px; padding: 34px 0 20px; }
      h1 { font-size: 32px; }
      main { padding-top: 22px; }
      .grid { grid-template-columns: 1fr; row-gap: 32px; }
      figcaption { padding-top: 11px; margin-top: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <svg class="landscape" viewBox="0 0 1600 1200" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="grass" width="52" height="46" patternUnits="userSpaceOnUse">
        <path d="M10 42q-2-8 2-15M14 42q1-10 7-17M38 44q-1-8-6-13M42 44q2-9 7-14" fill="none" stroke="#81965e" stroke-width="2" stroke-linecap="round" opacity=".42"/>
        <circle cx="27" cy="12" r="1.5" fill="#9eaa6f" opacity=".55"/>
      </pattern>
      <pattern id="path-grain" width="54" height="42" patternUnits="userSpaceOnUse">
        <circle cx="8" cy="11" r="2" fill="#b6a47b" opacity=".35"/>
        <circle cx="33" cy="28" r="1.5" fill="#b6a47b" opacity=".3"/>
        <path d="M20 7l4 1M43 14l3-1M13 34l3 1" stroke="#b6a47b" stroke-width="1.5" opacity=".3"/>
      </pattern>
    </defs>
    <rect width="1600" height="1200" fill="#cbd8a5"/>
    <rect width="1600" height="1200" fill="url(#grass)"/>
    <path d="M800 100 C1030 210 1050 280 850 420 C650 560 660 700 900 830 C1100 940 950 1010 780 1100" fill="none" stroke="#a7956c" stroke-width="550" stroke-linecap="round"/>
    <path d="M800 100 C1030 210 1050 280 850 420 C650 560 660 700 900 830 C1100 940 950 1010 780 1100" fill="none" stroke="#e8d6ad" stroke-width="528" stroke-linecap="round"/>
    <path d="M800 100 C1030 210 1050 280 850 420 C650 560 660 700 900 830 C1100 940 950 1010 780 1100" fill="none" stroke="url(#path-grain)" stroke-width="510" stroke-linecap="round"/>
    <path id="walk-route" d="M800 100 C1030 210 1050 280 850 420 C650 560 660 700 900 830 C1100 940 950 1010 780 1100" fill="none"/>
  </svg>
  <img class="walker" src="images/dog-walker.png" alt="散歩道を歩く犬" hidden>
  <div class="page">
    <header>
      <h1>アーカイブサイト</h1>
      <div class="count" aria-label="掲載数">01 — 05</div>
    </header>

    <main>
      <section class="grid" aria-label="写真一覧">
        <figure>
          <button class="photo-button" type="button" data-photo="images/01.jpg" aria-label="写真 01 を拡大">
            <img src="images/01.jpg" alt="資料写真 01" loading="eager">
          </button>
          <figcaption><span class="number">01</span><span class="name">天国？</span><span class="year">2022年</span></figcaption>
          <ul class="tags" aria-label="タグ">
            <li class="tag">天国？</li>
          </ul>
        </figure>
        <figure>
          <button class="photo-button" type="button" data-photo="images/02.jpg" aria-label="写真 02 を拡大">
            <img src="images/02.jpg" alt="資料写真 02" loading="lazy">
          </button>
          <figcaption><span class="number">02</span><span class="name">眠れる森の犬</span><span class="year">2024</span></figcaption>
          <ul class="tags" aria-label="タグ">
            <li class="tag">眠れる森の犬</li>
          </ul>
        </figure>
        <figure>
          <button class="photo-button" type="button" data-photo="images/03.jpg" aria-label="写真 03 を拡大">
            <img src="images/03.jpg" alt="資料写真 03" loading="lazy">
          </button>
          <figcaption><span class="number">03</span><span class="name">だるまさんがころんだ</span><span class="year">2025年</span></figcaption>
          <ul class="tags" aria-label="タグ">
            <li class="tag">だるまさんがころんだ</li>
          </ul>
        </figure>
        <figure>
          <button class="photo-button" type="button" data-photo="images/04.jpg" aria-label="写真 04 を拡大">
            <img src="images/04.jpg" alt="資料写真 04" loading="lazy">
          </button>
          <figcaption><span class="number">04</span><span class="name">何かわからんけど狙う</span><span class="year">2025年</span></figcaption>
          <ul class="tags" aria-label="タグ">
            <li class="tag">何かわからんけど狙う</li>
          </ul>
        </figure>
        <figure>
          <button class="photo-button" type="button" data-photo="images/05.jpg" aria-label="写真 05 を拡大">
            <img src="images/05.jpg" alt="資料写真 05" loading="lazy">
          </button>
          <figcaption><span class="number">05</span><span class="name">金曜ロードショーから変えんでな</span><span class="year">2023年</span></figcaption>
          <ul class="tags" aria-label="タグ">
            <li class="tag">金曜ロードショーから変えんでな</li>
          </ul>
        </figure>
      </section>
    </main>

    <footer class="site-footer" aria-label="おうち">
      <svg class="home-illustration" viewBox="0 0 300 190" role="img" aria-label="犬のおうち">
        <ellipse cx="150" cy="172" rx="120" ry="10" fill="#82905d" opacity=".25"/>
        <path d="M61 82 150 22l89 60-12 8-77-51-77 51z" fill="#a7664e" stroke="#554b38" stroke-width="4" stroke-linejoin="round"/>
        <path d="M83 82h134v82H83z" fill="#fff9eb" stroke="#554b38" stroke-width="4" stroke-linejoin="round"/>
        <path id="house-door" d="M119 164v-49c0-19 14-31 31-31s31 12 31 31v49z" fill="#76553f" stroke="#554b38" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="171" cy="127" r="3" fill="#f6d27b"/>
        <path d="M94 99h16v20H94zM190 99h16v20h-16z" fill="#c8d8d7" stroke="#554b38" stroke-width="3"/>
        <path d="M102 100v18m-8-9h16m88-9v18m-8-9h16" stroke="#554b38" stroke-width="2"/>
        <path d="M57 164c12-9 25-9 38 0m111 0c13-9 26-9 39 0" fill="none" stroke="#72824f" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </footer>
  </div>

  <dialog id="viewer" aria-label="写真の拡大表示">
    <button class="close" type="button" aria-label="閉じる">閉じる ×</button>
    <img src="" alt="拡大写真">
  </dialog>

  <script>
    const viewer = document.querySelector("#viewer");
    const viewerImage = viewer.querySelector("img");
    const walker = document.querySelector(".walker");
    const route = document.querySelector("#walk-route");
    const homeDoor = document.querySelector("#house-door");

    let walkerFrame = 0;
    function positionWalker() {
      walkerFrame = 0;
      if (!walker.naturalWidth) return;

      const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      const progress = Math.min(1, Math.max(0, window.scrollY / maxScroll));
      const approachStart = 0.88;
      const routeProgress = Math.min(progress, approachStart) / approachStart;
      const point = route.getPointAtLength(route.getTotalLength() * routeProgress);
      const screenPoint = new DOMPoint(point.x, point.y).matrixTransform(route.getScreenCTM());
      const door = homeDoor.getBoundingClientRect();
      const enterProgress = Math.max(0, Math.min(1, (progress - approachStart) / (1 - approachStart)));
      const easedEnter = enterProgress * enterProgress * (3 - 2 * enterProgress);
      const doorX = door.left + door.width / 2;
      const doorY = door.top + door.height * 0.65;
      const x = screenPoint.x + (doorX - screenPoint.x) * easedEnter;
      const y = screenPoint.y + (doorY - screenPoint.y) * easedEnter;
      const scale = 1 - easedEnter * 0.62;
      const fadeProgress = Math.max(0, Math.min(1, (enterProgress - 0.78) / 0.22));
      walker.classList.toggle("entering", enterProgress > 0.5);
      walker.style.left = `${x}px`;
      walker.style.top = `${y}px`;
      walker.style.transform = `translate(-50%, -62%) scale(${scale})`;
      walker.style.opacity = `${1 - fadeProgress}`;
    }

    function requestWalkerPosition() {
      if (!walkerFrame) walkerFrame = window.requestAnimationFrame(positionWalker);
    }

    walker.addEventListener("load", () => {
      walker.hidden = false;
      requestWalkerPosition();
    });
    if (walker.complete && walker.naturalWidth) {
      walker.hidden = false;
      requestWalkerPosition();
    }
    window.addEventListener("scroll", requestWalkerPosition, { passive: true });
    window.addEventListener("resize", requestWalkerPosition);

    document.querySelectorAll(".photo-button").forEach((button) => {
      button.addEventListener("click", () => {
        viewerImage.src = button.dataset.photo;
        viewer.showModal();
      });
    });

    viewer.querySelector(".close").addEventListener("click", () => viewer.close());
    viewer.addEventListener("click", (event) => {
      if (event.target === viewer) viewer.close();
    });
    viewer.addEventListener("close", () => { viewerImage.src = ""; });
  </script>
</body>
</html>
